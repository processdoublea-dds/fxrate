name: Scheduled API Fetch (Bypass Vercel Hobby Limit)

on:
  schedule:
    # Run Thai banks fetch every 10 mins from 00:00 to 03:50 UTC (07:00 to 10:50 BKK time) Monday-Friday
    - cron: '*/10 0-3 * * 1-5'
    # Run BOT/Bloomberg fetch at exactly 00:30 UTC (07:30 BKK time) Monday-Friday
    - cron: '30 0 * * 1-5'
    # Run Daily Verification & Comparison at exactly 02:55 UTC (09:55 BKK time) Monday-Friday
    - cron: '55 2 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Thai Banks API
        if: github.event.schedule == '*/10 0-3 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -H "Authorization: Bearer $CRON_SECRET" "https://fxrate-aa.vercel.app/api/fetch-thai-banks"
          
      - name: Hit BOT API
        if: github.event.schedule == '30 0 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -H "Authorization: Bearer $CRON_SECRET" "https://fxrate-aa.vercel.app/api/fetch-bot"

      - name: Hit Bloomberg API
        if: github.event.schedule == '30 0 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -H "Authorization: Bearer $CRON_SECRET" "https://fxrate-aa.vercel.app/api/fetch-bloomberg"

      - name: Hit Daily Verification API
        if: github.event.schedule == '55 2 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -H "Authorization: Bearer $CRON_SECRET" "https://fxrate-aa.vercel.app/api/verify-daily"
